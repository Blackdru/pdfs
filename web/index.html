    <!-- Runtime canonical and og:url based on environment/site URL -->
    <script type="module">
      const site = (import.meta.env?.VITE_SITE_URL || location.origin).replace(/\/+$/,'');
      const canon = document.getElementById('canonical');
      if (canon) canon.href = site + '/';
      const ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.setAttribute('content', site + '/');
    </script>
